name: Log out of a registry with ORAS
description: >
  Logs out of an OCI registry with oras logout, removing the credentials that
  login stored. Logging out of a registry the job isn't logged in to succeeds.
  The GitHub Actions twin of the orb's logout command.
author: juburr

inputs:
  registry:
    description: >
      Registry host to log out of: the same value login took.
    required: true

runs:
  using: composite
  steps:
    - name: ORAS Logout
      shell: bash
      env:
        PARAM_REGISTRY: ${{ inputs.registry }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/logout.sh"
        "SCRIPT_ORAS_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/oras.sh"
