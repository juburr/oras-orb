name: Push files as an OCI artifact with ORAS
description: >
  Pushes files to a registry as an OCI artifact with oras push, such as an SBOM,
  a scan report or a build output, and exports the digest of the manifest it
  pushed. Log in to the registry first, unless it allows anonymous pushes. The
  GitHub Actions twin of the orb's push command.
author: juburr

inputs:
  annotations:
    description: >
      Annotations for the artifact's manifest, one key=value per line, such as
      org.opencontainers.image.description=Nightly scan report.
    default: ""
  artifact_type:
    description: >
      The artifact's type, a media type such as
      application/vnd.example.report.v1. ORAS sets its own when this is empty.
    default: ""
  digest_env_var:
    description: >
      Name of the environment variable to set, for later steps, to the digest of
      the pushed manifest, such as sha256:4c1f….
    default: ORAS_PUSHED_DIGEST
  extra_args:
    description: >
      More arguments for oras push, split like shell words, such as
      --concurrency 10. Nothing in them is run as shell code.
    default: ""
  files:
    description: >
      Files or directories to push, relative to working_dir and separated by
      spaces or newlines. Quote a path that has spaces; wildcards are not
      expanded. Add :<media type> to a file to set its media type, such as
      sbom.json:application/spdx+json. ORAS stores each file under the path
      given here, and pull recreates it, so keep paths inside working_dir: pull
      refuses a path with .. that would leave its output directory.
    required: true
  plain_http:
    description: >
      Connect over plain HTTP instead of HTTPS, for a registry without TLS such
      as a local test registry.
    default: "false"
  reference:
    description: >
      Where to push the artifact: <registry>/<repository>:<tag>, such as
      ghcr.io/myorg/reports:1.0.0. Several tags can be pushed at once as
      <tag>,<tag>.
    required: true
  working_dir:
    description: >
      Directory that files are relative to.
    default: "."

runs:
  using: composite
  steps:
    - name: ORAS Push
      shell: bash
      env:
        PARAM_ANNOTATIONS: ${{ inputs.annotations }}
        PARAM_ARTIFACT_TYPE: ${{ inputs.artifact_type }}
        PARAM_DIGEST_ENV_VAR: ${{ inputs.digest_env_var }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FILES: ${{ inputs.files }}
        PARAM_PLAIN_HTTP: ${{ inputs.plain_http }}
        PARAM_REFERENCE: ${{ inputs.reference }}
        PARAM_WORKING_DIR: ${{ inputs.working_dir }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/push.sh"
        "SCRIPT_ORAS_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/oras.sh"
