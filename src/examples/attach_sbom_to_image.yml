description: >
  Attach an SBOM to an image that is already in a registry, by its digest, so
  anyone who can pull the image can find the SBOM with oras discover. The
  attached artifact's digest is exported as SBOM_DIGEST for later steps.

usage:
  version: 2.1
  orbs:
    oras: juburr/oras-orb@0.2.0
  jobs:
    attach-sbom:
      docker:
        - image: cimg/base:current-22.04
      environment:
        IMAGE_DIGEST_REF: ghcr.io/myorg/myapp@sha256:4c1f9a5e3b0e8b5d2c7a6f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c
      steps:
        - checkout
        - oras/install:
            version: "1.3.5"
        - oras/login:
            registry: ghcr.io
        - oras/attach:
            subject: ${IMAGE_DIGEST_REF}
            artifact_type: application/spdx+json
            files: sbom.spdx.json:application/spdx+json
            digest_env_var: SBOM_DIGEST
        - run:
            name: List The Image's Referrers
            command: oras discover "${IMAGE_DIGEST_REF}"
        - oras/logout:
            registry: ghcr.io
  workflows:
    sbom:
      jobs:
        - attach-sbom:
            context: registry-credentials
